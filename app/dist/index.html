<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 是让 env(safe-area-inset-*) 生效的前提；
       Android 端 MainActivity 走 enableEdgeToEdge()，内容会延伸到状态栏/手势条下面 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EmberMap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div id="status">就绪——打开游戏内地图后点「抓屏匹配」</div>
    <div id="controls">
      <button id="btn-capture">抓屏匹配</button>
      <button id="btn-reset" title="清除已锁定的变体，下次全库重扫">重新识别</button>
      <button id="btn-grant" hidden>授权投屏</button>
      <label><input type="checkbox" id="chk-watch" checked /> 自动监测</label>
      <label><input type="checkbox" id="chk-overlay" checked /> 覆盖模式</label>
      <label><input type="checkbox" id="chk-top" /> 窗口置顶</label>
      <label>叠加 <input type="range" id="rng-alpha" min="0" max="100" value="75" /></label>
    </div>
    <!-- 手动锁定：认对了就钉住，之后只跟这张图比，主界面等画面不会再被误判 -->
    <div id="pinbar">
      <button id="btn-pin" disabled>锁定当前</button>
      <select id="sel-map" title="锁定地图变体：钉住后只跟它比对"></select>
      <span id="floorbar">楼层
        <button class="floor on" data-floor="">自动</button>
        <button class="floor" data-floor="b1">地下室</button>
        <button class="floor" data-floor="1f">一楼</button>
        <button class="floor" data-floor="2f">二楼</button>
      </span>
      <span id="pinstate"></span>
    </div>
    <div id="hint">全局热键：⇧⌥M 切换覆盖层 · ⇧⌥R 重新识别</div>
  </header>
  <main>
    <canvas id="view"></canvas>
    <ul id="candidates"></ul>
    <!-- 叠加层几何：真机排障时用户拍一张就能对账，省一次「装包→复现」往返 -->
    <div id="geom"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
