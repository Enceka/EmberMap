<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 是让 env(safe-area-inset-*) 生效的前提；
       Android 端 MainActivity 走 enableEdgeToEdge()，内容会延伸到状态栏/手势条下面 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EmberMap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div id="status">就绪——打开游戏内地图后点「抓屏匹配」</div>
    <div id="controls">
      <button id="btn-capture">抓屏匹配</button>
      <button id="btn-reset" title="清除已锁定的变体，下次全库重扫">重新识别</button>
      <button id="btn-grant" hidden>授权投屏</button>
      <label><input type="checkbox" id="chk-watch" checked /> 自动监测</label>
      <label><input type="checkbox" id="chk-overlay" checked /> 覆盖模式</label>
      <label><input type="checkbox" id="chk-top" /> 窗口置顶</label>
      <!-- 用「不透明度」而非「透明度」：数值大 = 越实，与滑块方向一致，不会读反 -->
      <label>叠加层不透明度
        <input type="range" id="rng-alpha" min="10" max="100" value="45" />
        <span id="alpha-val">45%</span>
      </label>
      <label title="两轮识别之间歇多久。识别本身的耗时不受它影响">监测间隔
        <input type="range" id="rng-idle" min="0" max="5000" step="100" value="800" />
        <span id="idle-val">0.8s</span>
      </label>
    </div>
    <!-- 手动锁定：认对了就钉住，之后只跟这张图比，主界面等画面不会再被误判 -->
    <div id="pinbar">
      <button id="btn-pin" disabled>锁定当前</button>
      <select id="sel-map" title="锁定地图变体：钉住后只跟它比对"></select>
      <span id="floorbar">看整层
        <button class="floor on" data-floor="">跟随游戏</button>
        <button class="floor" data-floor="b1">地下室</button>
        <button class="floor" data-floor="1f">一楼</button>
        <button class="floor" data-floor="2f">二楼</button>
      </span>
      <span id="pinstate"></span>
    </div>
    <!-- 全局热键（仅桌面）：点按钮后直接按组合即可改键 -->
    <div id="hotkeybar" hidden>全局热键
      <button class="hk" data-key="capture_now">抓屏匹配 <b>…</b></button>
      <button class="hk" data-key="toggle_overlay">切换覆盖层 <b>…</b></button>
      <button class="hk" data-key="reset_lock">重新识别 <b>…</b></button>
      <button id="hk-reset" title="恢复 ⇧⌥C / ⇧⌥M / ⇧⌥R">恢复默认</button>
    </div>
    <div id="hint"></div>
  </header>
  <main>
    <canvas id="view"></canvas>
    <ul id="candidates"></ul>
    <!-- 叠加层几何：真机排障时用户拍一张就能对账，省一次「装包→复现」往返 -->
    <div id="geom"></div>
    <!-- 监测节奏的实测代价：拿真实耗时算，不写死一句「可能影响性能」 -->
    <div id="perf"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
