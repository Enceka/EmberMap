name: Release

# 三条发布路径，共用同一套构建：
#   打 tag v*   → 正式版，Release 名 EmberMap v0.1.0
#   推 main     → 测试版，滚动覆盖 nightly 这一个预发布（旧的先删再传）
#   手动 dispatch → 测试版，用填入的 tag 名，标为预发布
# 三条都是：四个平台先传进同一个草稿 Release，全部成功后 publish job 转正式。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 手动发布用的 tag 名（如 v0.1.0-test），发预发布
        required: true

permissions:
  contents: write

# 同一目标不并发：连推两次 main 时后一次取消前一次，
# 免得两个 run 抢同一个 nightly Release（一边删一边传）
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: 确定发布参数
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      banner: ${{ steps.plan.outputs.banner }}
    steps:
      - name: 按触发方式决定 tag / 名称 / 是否预发布
        id: plan
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            name="EmberMap $INPUT_TAG（测试）"
            pre=true
            banner="> ⚠️ 手动触发的测试构建（commit $short），未经实机验证。"
          elif [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            name="EmberMap $REF_NAME"
            pre=false
            banner=""
          else
            tag=nightly
            name="EmberMap 测试版（main）"
            pre=true
            banner="> ⚠️ main 分支的滚动测试构建（commit $short），每次推送覆盖，未经实机验证。要稳定版请找带版本号的正式 Release。"
          fi
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$pre"
            echo "banner=$banner"
          } >> "$GITHUB_OUTPUT"
          echo "本次发布：$tag（prerelease=$pre）"

      # nightly 是滚动的：不先删，上一轮的产物会和这一轮混在同一个 Release 里
      - name: 清掉上一份 nightly
        if: steps.plan.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" \
            || echo "没有旧的 nightly，跳过"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-13          # Intel
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev \
            libpipewire-0.3-dev libdbus-1-dev libclang-dev libgbm-dev
          # libgbm-dev：xcap 的 Wayland 路径（libwayshot_xcap → gbm）链接 -lgbm，
          # runner 只自带运行时 libgbm1（仅 .so.1），没有 -dev 的无版本 .so 软链，
          # 链接期会报 unable to find library -lgbm。
          # 必须用 24.04：xcap 在 Linux 上无条件编译 Wayland 抓屏路径
          # （libspa-sys → pipewire），而 libspa 0.10 需要较新的 pipewire 头文件；
          # 22.04 自带 pipewire 0.3.48，缺 spa_video_info_raw.flags 等字段会编译失败，
          # 24.04 为 1.0.5。代价：产物链接 glibc 2.39，无法在更老的发行版上运行。

      - name: 校验数据包完整（39 个楼层掩码）
        shell: bash
        run: |
          test -f app/bundle/bundle.json || { echo "缺少 app/bundle/bundle.json"; exit 1; }
          n=$(ls app/bundle/masks/*.png | wc -l | tr -d ' ')
          echo "掩码数量：$n"
          test "$n" -eq 39 || { echo "掩码数量应为 39，实际 $n"; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: ${{ needs.meta.outputs.name }}
          releaseBody: |
            ${{ needs.meta.outputs.banner }}

            第五人格加页手记地图识别辅助（噩梦难度）。

            **平台包**：macOS 用 `.dmg`（Apple Silicon 选 arm64、Intel 选 x64），
            Windows 用 `-setup.exe`，Linux 用 `.AppImage` 或 `.deb`。

            **首次运行需授权屏幕录制**：
            - macOS：系统设置 → 隐私与安全性 → 屏幕录制 → 勾选 EmberMap，然后重启应用。
            - Windows / Linux：无需额外授权。

            **未签名说明**：macOS 首次打开请右键 → 打开；Windows 可能出现
            SmartScreen 提示，选「更多信息 → 仍要运行」。

            **热键**：⇧⌥M 切换覆盖层，⇧⌥R 重新识别。

            > 本工具只处理屏幕画面，不读取游戏内存、不注入、不模拟操作。
            > 地图素材来源见仓库 README 结尾。
          releaseDraft: true
          prerelease: ${{ needs.meta.outputs.prerelease }}
          args: --target ${{ matrix.target }}

  # 四个平台先各自上传到同一个草稿 Release（草稿期间外部看不到，
  # 避免只传完 macOS 就被人下到半份产物），全部成功后再一次性转正式。
  # 任一平台失败则此 job 跳过，Release 留作草稿，可修完重跑。
  publish:
    name: 发布 Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: 草稿转正式
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
