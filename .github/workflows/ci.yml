name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: em-core 测试与真值回归
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: em-core
      # 含 tests/synth_regression.rs：从参考库自身合成部分探索查询，
      # 匹配须找回原条目且尺度可复原。不依赖任何外部截图。
      - name: 单元测试与合成回归
        run: cargo test --release --manifest-path em-core/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path em-core/Cargo.toml --all-targets -- -D warnings

  app:
    name: 应用构建与状态机测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev \
            libpipewire-0.3-dev libdbus-1-dev libclang-dev libgbm-dev
          # libgbm-dev：xcap 的 Wayland 路径（libwayshot_xcap → gbm）链接 -lgbm，
          # runner 只自带运行时 libgbm1（仅 .so.1），没有 -dev 的无版本 .so 软链，
          # 链接期会报 unable to find library -lgbm。
          # 必须用 24.04：xcap 在 Linux 上无条件编译 Wayland 抓屏路径
          # （libspa-sys → pipewire），而 libspa 0.10 需要较新的 pipewire 头文件；
          # 22.04 自带 pipewire 0.3.48，缺 spa_video_info_raw.flags 等字段会编译失败，
          # 24.04 为 1.0.5。代价：产物链接 glibc 2.39，无法在更老的发行版上运行。
      - name: 状态机单元测试
        run: cargo test --release --manifest-path app/src-tauri/Cargo.toml
      - name: 构建检查
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml
