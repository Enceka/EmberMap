name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: em-core 测试与真值回归
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: em-core
      - name: 单元测试
        run: cargo test --release --manifest-path em-core/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path em-core/Cargo.toml --all-targets -- -D warnings
      - name: 真值回归（已知截图必须识别正确）
        run: |
          cargo build --release --manifest-path em-core/Cargo.toml --example sweep
          ./em-core/target/release/examples/sweep app/bundle \
            "test/shot-20260826-2219.png:右中门1-2:1f" \
            "test/shot-20260827-2114.png:左中门1-1:1f" | tee /tmp/sweep.log
          # sweep 对识别正确的配置打 ✓，出现 ✗ 即回归
          if grep -q '✗' /tmp/sweep.log; then
            echo "::error::识别回归：有配置未能正确识别已知截图"
            exit 1
          fi

  app:
    name: 应用构建与状态机测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev
      - name: 状态机单元测试
        run: cargo test --release --manifest-path app/src-tauri/Cargo.toml
      - name: 构建检查
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml
