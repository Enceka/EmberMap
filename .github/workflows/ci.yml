name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: em-core 测试与真值回归
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: em-core
      # 含 tests/synth_regression.rs：从参考库自身合成部分探索查询，
      # 匹配须找回原条目且尺度可复原。不依赖任何外部截图。
      - name: 单元测试与合成回归
        run: cargo test --release --manifest-path em-core/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path em-core/Cargo.toml --all-targets -- -D warnings

  app:
    name: 应用构建与状态机测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev \
            libpipewire-0.3-dev libdbus-1-dev libclang-dev
          # xcap 在 Linux 上无条件编译 Wayland 抓屏路径（libspa-sys → pipewire），
          # 没有特性开关可关，故 pipewire 开发包是必需的；libclang 供其 bindgen 用
      - name: 状态机单元测试
        run: cargo test --release --manifest-path app/src-tauri/Cargo.toml
      - name: 构建检查
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml
